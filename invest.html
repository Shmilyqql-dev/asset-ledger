<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="资产记账本">
<meta name="theme-color" content="#2563EB">
<title>投资明细 · 资产记账本</title>
<style>
  :root{
    --primary:#2563EB; --primary-d:#1D4ED8;
    --ink:#1E3A5F; --ink2:#5B7DA6; --ink3:#94A3B8;
    --up:#DC2626; --down:#15803D;
    --line:rgba(37,99,235,.12);
    --glass:rgba(255,255,255,.55);
    --glass-strong:rgba(255,255,255,.78);
    --stroke:rgba(255,255,255,.85);
    --bad:#DC2626; --bad-bg:rgba(254,226,226,.8);
    --warn:#B45309; --warn-bg:rgba(254,243,199,.8);
    --ok:#15803D; --ok-bg:rgba(220,252,231,.8);
    --info:#2563EB; --info-bg:rgba(219,234,254,.8);
    --cash:#0891B2; --cash-bg:rgba(207,250,254,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#DCE8F7,#EDF2FA,#D6E4F5);
    background-attachment:fixed;min-height:100vh;color:var(--ink);font-size:13px;line-height:1.5;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  .app{max-width:1080px;margin:0 auto;padding:20px 16px 0}
  .glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--stroke);border-radius:17px;box-shadow:0 6px 22px rgba(37,99,235,.07);}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand .icobox{width:40px;height:40px;border-radius:12px;background:#EBF1FF;display:flex;align-items:center;justify-content:center;color:var(--primary)}
  .brand h1{font-size:17px;font-weight:800;color:#1E3A8A;letter-spacing:.3px}
  .brand p{font-size:11px;color:var(--ink2);margin-top:1px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  /* 按钮 */
  button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 15px;border-radius:12px;font-weight:600;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:var(--glass-strong);border:1px solid var(--stroke);color:var(--primary)}
  .btn-ghost:hover{background:#fff}
  .btn-danger{background:var(--glass-strong);border:1px solid rgba(220,38,38,.35);color:var(--bad)}
  .btn-danger:hover{background:rgba(220,38,38,.08)}
  .btn-sm{min-height:38px;padding:0 11px;font-size:12px;border-radius:10px}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);transition:.15s}
  .icon-btn:hover{background:rgba(37,99,235,.1);color:var(--primary)}
  .icon-btn.del:hover{background:rgba(220,38,38,.1);color:var(--bad)}
  /* 工具栏 */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px}
  .toolbar .grow{flex:1;min-width:0;font-size:12px;color:var(--ink2)}
  select.mini{font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--stroke);
    background:var(--glass-strong);color:var(--ink);min-height:44px;font-family:inherit;font-weight:700}
  /* 区块 */
  .todo{padding:16px 18px;margin-bottom:14px;border-left:4px solid var(--primary)}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:12px}
  .sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
  .todo-list{display:flex;flex-direction:column;gap:9px}
  .todo-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:var(--glass-strong)}
  .todo-item .badge{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px}
  .badge.bad{color:var(--bad);background:var(--bad-bg)}
  .badge.warn{color:var(--warn);background:var(--warn-bg)}
  .badge.info{color:var(--info);background:var(--info-bg)}
  .badge.ok{color:var(--ok);background:var(--ok-bg)}
  .todo-item .txt{flex:1;min-width:0}
  .todo-item .txt b{color:var(--ink)}
  .todo-item .txt small{display:block;color:var(--ink2);font-size:11px;margin-top:1px}
  .empty-ok{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:13px;font-weight:600;padding:6px 2px}
  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:14px}
  .stat{padding:15px 16px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
  .stat.c2::before{background:#0891B2}.stat.c3::before{background:#4F46E5}.stat.c4::before{background:#64748B}
  .stat .lab{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .stat .num{font-size:26px;font-weight:800;color:#172554;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px;word-break:break-all}
  .stat .sub{font-size:11px;color:var(--ink3);margin-top:6px}
  .stat .num.g{color:var(--ok)}.stat .num.r{color:var(--bad)}
  /* 面板 */
  .panel{padding:17px 18px;margin-bottom:14px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .panel-head h2{font-size:14px;font-weight:800;color:var(--ink)}
  .panel-head .hint{font-size:11px;color:var(--ink3);font-weight:400;margin-top:2px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* 渠道 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 5px 5px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--stroke);font-size:12px;color:var(--ink);font-weight:600}
  .chip .kind{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;cursor:pointer;user-select:none}
  .chip .kind.cash{color:var(--cash);background:var(--cash-bg)}
  .chip .kind.inv{color:var(--warn);background:var(--warn-bg)}
  .chip .x{width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);cursor:pointer}
  .chip .x:hover{background:rgba(220,38,38,.12);color:var(--bad)}
  .chip-add{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;border:1px dashed var(--primary);color:var(--primary);font-size:12px;font-weight:600;cursor:pointer;background:transparent}
  .chip-add:hover{background:#EBF1FF}
  .mini-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
  .mini-tag.cash{color:var(--cash);background:var(--cash-bg)}
  .mini-tag.inv{color:var(--warn);background:var(--warn-bg)}
  /* 图表 */
  .chart-wrap{width:100%;overflow:hidden}
  .chart-wrap>svg{width:100%;height:auto;display:block}
  .empty svg{width:24px;height:24px;flex:none}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:6px;justify-content:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* 表格 */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:560px}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--ink2);font-weight:700;background:rgba(255,255,255,.35)}
  tbody tr:nth-child(even){background:rgba(255,255,255,.12)}
  tbody tr:hover{background:rgba(219,234,254,.45)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tfoot td{border-top:2px solid rgba(37,99,235,.25);border-bottom:none;background:rgba(219,234,254,.4);font-weight:800;color:#172554}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px}
  .tag.hold{color:var(--warn);background:var(--warn-bg)}
  .tag.done{color:var(--ok);background:var(--ok-bg)}
  .tag.base{color:var(--ink2);background:rgba(226,232,240,.85)}
  .val-up{color:var(--up)}.val-down{color:var(--down)}.val-flat{color:var(--ink2)}
  .g{color:var(--ok)}.r{color:var(--bad)}.n{color:var(--ink2)}
  /* 预览框 */
  .preview{border-radius:12px;padding:12px 14px;background:rgba(219,234,254,.5);border:1px solid rgba(37,99,235,.16);margin-bottom:14px}
  .preview .pv-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2);padding:2.5px 0}
  .preview .pv-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}
  .preview .pv-main{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(37,99,235,.25)}
  .preview .pv-main span{font-size:12px;color:var(--ink2);font-weight:700}
  .preview .pv-main .pv-big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .hintline{font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:8px 11px;border-radius:9px;margin-top:9px;line-height:1.6}
  /* 备份 */
  .backup{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .tip{font-size:11px;color:var(--ink2);margin-top:10px;line-height:1.6}
  .notice{font-size:11.5px;padding:10px 13px;border-radius:10px;margin-bottom:13px;line-height:1.65}
  /* 空状态 */
  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;color:var(--ink3)}
  .empty span{font-size:12px}
  /* 模态框 */
  .mask{position:fixed;inset:0;background:rgba(30,58,95,.32);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:90}
  .modal{background:rgba(255,255,255,.97);border:1px solid var(--stroke);border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(30,58,95,.25)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:15px;font-weight:800;color:#1E3A8A}
  .modal-body{padding:18px 20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:6px}
  .field label .mini-tag{vertical-align:1px}
  .field input,.field select,.field textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
    padding:10px 12px;min-height:44px;border:1px solid var(--stroke);border-radius:12px;background:var(--glass-strong);outline:none;transition:.15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .modal .field input,.modal .field select,.modal .field textarea{background:#fff;border-color:rgba(37,99,235,.22)}
  .field textarea{resize:vertical;min-height:64px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .confirm-txt{font-size:13.5px;color:var(--ink);line-height:1.75;padding:4px 0}
  /* Toast */
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:rgba(30,58,95,.94);color:#fff;
    padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ============ 导航：PC 顶部 / 手机底部 ============ */
  .nav{position:fixed;left:0;right:0;z-index:60;display:flex;background:rgba(255,255,255,.82);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-decoration:none;color:var(--ink2);font-size:11px;font-weight:600;padding:9px 2px;transition:.15s;position:relative}
  .nav a .ni{display:flex;align-items:center;justify-content:center}
  .nav a.active{color:var(--primary);font-weight:800}
  .nav a.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
  /* 手机：底部固定 */
  .nav{bottom:0;padding-bottom:env(safe-area-inset-bottom);border-radius:0}
  .nav a{min-height:56px}
  /* 桌面：吸顶横排 */
  @media(min-width:769px){
    body{padding-bottom:24px;padding-top:0}
    .app{padding-top:14px}
    .nav{top:0;bottom:auto;padding-bottom:0;border-top:none;border-bottom:1px solid var(--line);
      justify-content:center;gap:6px;border-radius:0}
    .nav a{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:13px 20px;min-height:52px}
    .nav a.active::before{top:auto;bottom:0;width:100%;height:2.5px;border-radius:3px 3px 0 0}
    .app{margin-top:52px}
    .toast{bottom:34px}
  }
  /* 响应式 */
  @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){
    .app{padding:14px 12px 0}
    .topbar{padding:14px}
    .brand h1{font-size:16px}
    .stats{gap:10px}
    .stat{padding:13px 12px}
    .stat .num{font-size:18px;letter-spacing:-.5px}
    .todo-item{flex-wrap:wrap}
    .todo-item .btn{margin-left:auto;flex-shrink:0}
    .panel{padding:14px}
    .grid2{grid-template-columns:1fr;gap:0}
    .toolbar{padding:11px 13px}
    .chart-wrap>svg text{font-size:15px}
  }
  /* iPhone 添加到主屏幕引导 */
  .ios-tip{display:none;padding:13px 15px;margin-bottom:14px;border-left:4px solid #0891B2;line-height:1.7}
  .ios-tip b{color:#1E3A8A}
  .ios-tip .steps{font-size:12px;color:var(--ink);margin-top:5px}
  body.is-ios-safari .ios-tip{display:block}
</style>
</head>
<body>
<div class="app">

  <div class="glass topbar">
    <div class="brand">
      <div class="icobox" id="brandIco"></div>
      <div><h1>投资明细</h1><p>黄金 / 债基 · 投入与赎回</p></div>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost btn-sm" id="btnExportInvCsv"></button>
      <button class="btn btn-primary btn-sm" id="btnAddInv"></button>
    </div>
  </div>

  <div class="stats">
    <div class="glass stat c1"><div class="lab" id="il1"></div><div class="num" id="in1">—</div><div class="sub" id="is1"></div></div>
    <div class="glass stat c2"><div class="lab" id="il2"></div><div class="num" id="in2">—</div><div class="sub" id="is2"></div></div>
    <div class="glass stat c3"><div class="lab" id="il3"></div><div class="num" id="in3">—</div><div class="sub" id="is3"></div></div>
    <div class="glass stat c4"><div class="lab" id="il4"></div><div class="num" id="in4">—</div><div class="sub" id="is4"></div></div>
  </div>

  <div class="glass panel">
    <div class="panel-head"><div><h2>全部投资</h2><div class="hint" id="invCountHint"></div></div></div>
    <div class="table-wrap" id="invTableWrap"></div>
    <div class="tip">这里记的是<b>每一笔</b>买卖的明细，方便你看单项收益。理财整体的浮盈浮亏不在这里算，首页和上面的卡片是按月度余额自动算的。<br><b style="color:#B45309">投资的钱已经在总资产里了</b>——以「理财渠道市值」的形式。这里的投入金额<b>不再重复计入总资产</b>，否则一笔钱算两遍。</div>
  </div>

</div>

<script>
/* ==================== 图标字典（全站统一线性 SVG） ==================== */
const ICONS = {
  home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 21v-7h6v7"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-4v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1H21v4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

/* ==================== 数据层 v2 ==================== */
/* 严禁预置任何编造的资产金额：账本打开即为空，全部数据由本人自行录入 */
function chName(c){return typeof c==='string'?c:String((c&&c.name)||'');}
function chIsInv(c){return typeof c==='string'?false:!!(c&&c.isInvestment);}

function seedState(){
  const chs=DEFAULT_CHANNELS.map(function(c){return {name:c.name,isInvestment:c.isInvestment};});
  return {version:2,channels:chs,snapshots:[],investments:[],isSample:false};
}

/* 旧版名称推断：v1 渠道只是字符串，没有任何现金/理财标记。
   按名称给个合理默认（可在资产页一键翻转），避免旧账本全部被当成现金。 */
const INV_NAME_HINT=/债基|基金|股票|黄金|国债|理财|ETF|指数|信托|定投/;

/* 兼容升级：v1（channels 为字符串数组、快照只有 values）→ v2 */
function migrateState(raw){
  if(!raw||typeof raw!=='object')return null;
  const out={version:2,channels:[],snapshots:[],investments:[],isSample:false};
  const seen={};
  const srcCh=Array.isArray(raw.channels)?raw.channels:[];
  srcCh.forEach(function(c){
    let nm='',inv=false;
    if(typeof c==='string'){nm=c;inv=INV_NAME_HINT.test(c);}
    else if(c&&c.name){nm=String(c.name);inv=!!c.isInvestment;}
    nm=nm.trim();
    if(!nm||seen[nm])return;
    seen[nm]=1;out.channels.push({name:nm,isInvestment:inv});
  });
  if(!out.channels.length)out.channels=seedState().channels;

  const srcSnap=Array.isArray(raw.snapshots)?raw.snapshots:[];
  srcSnap.forEach(function(s){
    if(!s||!s.month)return;
    const vals={};
    if(s.values&&typeof s.values==='object'){
      for(const k in s.values){const v=Number(s.values[k]);if(!isNaN(v))vals[k]=v;}
    }
    out.snapshots.push({
      id:s.id||uid(),
      month:String(s.month),
      income:num(s.income),
      investIn:num(s.investIn),
      investOut:num(s.investOut),
      values:vals,
      note:s.note?String(s.note):'',
      isCatchUp:!!s.isCatchUp
    });
  });

  const srcInv=Array.isArray(raw.investments)?raw.investments:[];
  srcInv.forEach(function(v){
    if(!v)return;
    out.investments.push({
      id:v.id||uid(),
      name:v.name?String(v.name):'未命名',
      channel:v.channel?String(v.channel):'',
      investAmount:num(v.investAmount),
      investDate:v.investDate?String(v.investDate):'',
      redeemAmount:num(v.redeemAmount),
      redeemDate:v.redeemDate?String(v.redeemDate):'',
      status:v.status==='redeemed'?'redeemed':'holding',
      note:v.note?String(v.note):''
    });
  });

  out.isSample=false;
  return out;
}

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&Array.isArray(s.snapshots)&&Array.isArray(s.investments)&&Array.isArray(s.channels)){
        if(s.isSample===true)return seedState();   /* 丢弃旧版编造的示例数据，绝不再展示 */
        const m=migrateState(s);
        if(m){localStorage.setItem(KEY,JSON.stringify(m));return m;}
      }
    }
  }catch(e){}
  const s=seedState();localStorage.setItem(KEY,JSON.stringify(s));return s;
}
function saveState(){state.version=2;localStorage.setItem(KEY,JSON.stringify(state));}
let state=loadState();

/* ==================== 计算层 ==================== */
function valOf(s,name){
  if(!s||!s.values)return 0;
  const v=s.values[name];const n=Number(v);return isNaN(n)?0:n;
}
function isInvestChannel(name){
  const c=state.channels.find(function(x){return chName(x)===name;});
  return c?chIsInv(c):false;
}
/* 现金类渠道合计 */
function cashTotal(s){
  let t=0;state.channels.forEach(function(c){if(!chIsInv(c))t+=valOf(s,chName(c));});return t;
}
/* 理财类渠道市值合计 */
function investValue(s){
  let t=0;state.channels.forEach(function(c){if(chIsInv(c))t+=valOf(s,chName(c));});return t;
}
function snapTotal(s){return cashTotal(s)+investValue(s);}
function sortedSnaps(){return state.snapshots.slice().sort(function(a,b){return a.month.localeCompare(b.month);});}
function latestSnap(){const a=sortedSnaps();return a.length?a[a.length-1]:null;}
function hasMonth(m){return state.snapshots.some(function(s){return s.month===m;});}
function monthIdx(m){const p=String(m).split('-');return Number(p[0])*12+(Number(p[1])-1);}
function monthDiff(a,b){return monthIdx(b)-monthIdx(a);}
/* 严格早于 month 的最近一条记录 */
function prevSnapOf(month){
  const arr=sortedSnaps().filter(function(s){return s.month<month;});
  return arr.length?arr[arr.length-1]:null;
}
function investProfit(inv){if(inv.status!=='redeemed')return null;return num(inv.redeemAmount)-num(inv.investAmount);}
function realizedProfit(){let t=0;state.investments.forEach(function(i){const p=investProfit(i);if(p!==null)t+=p;});return t;}
function holdingCount(){return state.investments.filter(function(i){return i.status==='holding';}).length;}
function holdingPrincipal(){let t=0;state.investments.forEach(function(i){if(i.status==='holding')t+=num(i.investAmount);});return t;}

/* 单月核心计算
   I 收入 · A 总资产 · C 现金类合计 · M 理财市值
   F 净投入理财 = 投入 − 赎回 · G 理财浮盈亏 · E 日常支出
   G = ΔM − F        E = I − ΔC − F        ΔA = I − E + G            */
function calcMonth(s){
  const prev=prevSnapOf(s.month);
  const total=snapTotal(s),cash=cashTotal(s),inv=investValue(s);
  const income=num(s.income),fin=num(s.investIn),fout=num(s.investOut),f=fin-fout;
  const r={month:s.month,snap:s,prev:prev,status:'ok',span:1,hints:[],
    total:total,cash:cash,investValue:inv,income:income,investIn:fin,investOut:fout,f:f,
    prevTotal:null,prevCash:null,prevInvestValue:null,
    deltaA:null,deltaC:null,deltaM:null,g:null,dailyExpense:null};
  if(!prev){
    r.status='baseline';
    r.hints.push('这是第一条记录，仅作起点，不计算当月支出与理财盈亏');
    return r;
  }
  r.prevTotal=snapTotal(prev);r.prevCash=cashTotal(prev);r.prevInvestValue=investValue(prev);
  r.deltaA=total-r.prevTotal;r.deltaC=cash-r.prevCash;r.deltaM=inv-r.prevInvestValue;
  r.g=r.deltaM-f;
  r.dailyExpense=income-r.deltaC-f;
  r.span=monthDiff(prev.month,s.month);
  if(r.span>1){
    r.status='catchup';
    r.hints.push('距上次记录已过 '+r.span+' 个月，本期支出/理财盈亏是这 '+r.span+' 个月的合计');
  }
  if(income===0){
    if(r.status==='ok')r.status='noincome';
    r.hints.push('本月收入填的是 0：如果确实没收入请忽略；如果有收入没填，支出会被算低');
  }
  if(r.dailyExpense<0){
    r.hints.push('支出算出负数：说明本月现金不降反增，且增幅超过你填的收入，通常是收入没填全（奖金 / 报销 / 回款），或渠道余额填错了');
  }
  return r;
}
/* 全年汇总 */
function calcYear(year){
  const y=String(year);
  const all=sortedSnaps();
  const inYear=all.filter(function(s){return s.month.slice(0,4)===y;});
  const r={year:y,months:inYear.length,income:0,dailyExpense:0,investProfit:0,
    investIn:0,investOut:0,netInvest:0,cashStart:null,cashEnd:null,
    assetStart:null,assetEnd:null,assetNet:null,
    countedMonths:0,catchupMonths:0,baselineMonths:0,hasPrevYear:false,hasData:inYear.length>0};
  if(!inYear.length)return r;
  const before=all.filter(function(s){return s.month.slice(0,4)<y;});
  r.hasPrevYear=before.length>0;
  if(r.hasPrevYear){
    const p=before[before.length-1];
    r.assetStart=snapTotal(p);r.cashStart=cashTotal(p);
  }else{
    r.assetStart=snapTotal(inYear[0]);r.cashStart=cashTotal(inYear[0]);
  }
  r.assetEnd=snapTotal(inYear[inYear.length-1]);
  r.cashEnd=cashTotal(inYear[inYear.length-1]);
  r.assetNet=r.assetEnd-r.assetStart;
  inYear.forEach(function(s){
    const c=calcMonth(s);
    r.income+=c.income;
    r.investIn+=c.investIn;r.investOut+=c.investOut;r.netInvest+=c.f;
    if(c.status==='baseline'){r.baselineMonths++;return;}
    r.dailyExpense+=c.dailyExpense;
    r.investProfit+=c.g;
    r.countedMonths++;
    if(c.span>1)r.catchupMonths++;
  });
  return r;
}

}

}
function exportInvCsv(){
  const head=['项目名称','渠道','投入金额','投入时间','赎回金额','赎回时间','收益','状态','备注'],rows=[head.map(csvCell).join(',')];
  state.investments.forEach(function(v){
    const p=investProfit(v);
    rows.push([v.name,v.channel||'',v.investAmount,v.investDate,v.status==='redeemed'?v.redeemAmount:'',v.redeemDate||'',p===null?'':p,v.status==='redeemed'?'已赎回':'持有中',v.note||''].map(csvCell).join(','));
  });
  downloadFile('投资明细_'+today.toISOString().slice(0,10)+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('投资明细 CSV 已导出');
}
function refreshAll(){renderInvStats();renderInvTable();}
document.addEventListener('DOMContentLoaded',function(){
  initIOS();
  document.getElementById('brandIco').innerHTML=icon('invest',22);
  document.getElementById('btnExportInvCsv').innerHTML=icon('download',15)+' 导出 CSV';
  document.getElementById('btnAddInv').innerHTML=icon('plus',15)+' 记一笔投资';
  document.getElementById('btnExportInvCsv').onclick=exportInvCsv;
  document.getElementById('btnAddInv').onclick=addInv;
  refreshAll();
});
</script>
